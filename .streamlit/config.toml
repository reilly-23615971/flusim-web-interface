[global]

disableWidgetStateDuplicationWarning = true

[runner]

magicEnabled = false

[server]

folderWatchBlacklist = ["logs"]
enableStaticServing = true

[browser]

gatherUsageStats = false

[theme]
baseFontSize = 22

[theme.light]

primaryColor = "#c53948"

[theme.dark]

primaryColor = "#cf4250"